<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xlr38 | bio</title>
    <!-- Google Fonts: JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <style>
        /* === BASE & RESET === */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-deep: #060606;
            --card-bg: rgba(15, 15, 15, 0.65);
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.7);
            --text-primary: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.4);
            --text-silver: #c0c0c0;
            --accent-glow: rgba(255, 255, 255, 0.15);
        }

        body {
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(circle at 50% 35%, rgba(40, 40, 40, 0.35) 0%, rgba(6, 6, 6, 0.95) 70%),
                radial-gradient(circle at 20% 80%, rgba(25, 25, 25, 0.2) 0%, transparent 50%);
            color: var(--text-primary);
            font-family: 'JetBrains Mono', monospace;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient subtle grid line */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        /* Ambient cursor glow */
        .ambient-glow {
            position: fixed;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.035) 0%, rgba(0, 0, 0, 0) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
            transform: translate(-50%, -50%);
            transition: opacity 0.3s ease;
        }

        /* === PROFILE CARD === */
        .profile-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 16px;
            border: 1px solid var(--border-subtle);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            padding: 34px 28px;
            text-align: center;
            animation: cardAppear 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(16px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* === 1. AVATAR === */
        .avatar-link {
            position: relative;
            display: inline-block;
            margin-bottom: 18px;
            text-decoration: none;
            cursor: pointer;
        }

        .avatar-img {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            border: 1.5px solid rgba(255, 255, 255, 0.25);
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), 
                        border-color 0.4s ease, 
                        box-shadow 0.4s ease;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        .avatar-link:hover .avatar-img {
            transform: scale(1.05);
            border-color: #ffffff;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.35);
        }

        /* Online status dot */
        .status-dot {
            position: absolute;
            bottom: 4px;
            right: 4px;
            width: 12px;
            height: 12px;
            background-color: #22c55e;
            border: 2px solid #080808;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(34, 197, 94, 0.7);
        }

        /* === 2. NICKNAME & LIQUID SILVER === */
        .nickname-wrapper {
            margin-bottom: 12px;
        }

        .nickname {
            display: inline-block;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            text-decoration: none;
            cursor: pointer;
            position: relative;
            user-select: none;
            /* Liquid silver shimmer */
            background: linear-gradient(110deg, #ffffff 0%, #ffffff 30%, #525252 50%, #ffffff 70%, #ffffff 100%);
            background-size: 250% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: silverShine 4.5s linear infinite;
            filter: drop-shadow(0 2px 10px rgba(255, 255, 255, 0.12));
            transition: filter 0.3s ease, transform 0.2s ease;
        }

        .nickname:hover {
            filter: drop-shadow(0 0 14px rgba(255, 255, 255, 0.4));
            transform: scale(1.02);
        }

        @keyframes silverShine {
            0% { background-position: 180% 0; }
            100% { background-position: -180% 0; }
        }

        /* Badges list */
        .badge-list {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 8px;
            flex-wrap: nowrap;
            white-space: nowrap;
        }

        .badge-item {
            font-size: 9.5px;
            color: rgba(255, 255, 255, 0.65);
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 6px;
            padding: 3px 6px;
            letter-spacing: 0.01em;
            white-space: nowrap;
            flex-shrink: 0;
            transition: border-color 0.2s ease, color 0.2s ease, background 0.2s ease;
        }

        .badge-item:hover {
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
        }

        .badge-accent {
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.07);
            font-weight: 700;
        }

        /* === 3. BIO-STATUS === */
        .bio-status {
            font-size: 11.5px;
            color: var(--text-muted);
            line-height: 1.6;
            max-width: 350px;
            margin: 0 auto 20px auto;
            letter-spacing: 0.02em;
        }

        /* === 4. SOCIAL LINKS GRID (4 BUTTONS) === */
        .socials-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 0;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 44px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 10px;
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .social-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
            transition: transform 0.25s ease, fill 0.25s ease;
        }

        .social-btn:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--border-hover);
            color: #ffffff;
            box-shadow: 0 0 16px rgba(255, 255, 255, 0.18);
        }

        .social-btn:hover svg {
            transform: scale(1.1);
        }

        /* Tooltip */
        .btn-tooltip {
            position: absolute;
            bottom: calc(100% + 6px);
            left: 50%;
            transform: translateX(-50%) translateY(4px);
            background: #111111;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.9);
            font-size: 10px;
            padding: 3px 7px;
            border-radius: 5px;
            pointer-events: none;
            opacity: 0;
            transition: all 0.2s ease;
            white-space: nowrap;
            z-index: 30;
        }

        .social-btn:hover .btn-tooltip {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }


        /* === 6. BOTTOM VIEW COUNTER (OUTSIDE CARD) === */
        .view-counter {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 20;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 6px 12px;
            background: rgba(14, 14, 14, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 0.05em;
            user-select: none;
            transition: border-color 0.25s ease, color 0.25s ease;
        }

        .view-counter:hover {
            border-color: rgba(255, 255, 255, 0.25);
            color: rgba(255, 255, 255, 0.8);
        }

        .view-counter svg {
            width: 14px;
            height: 14px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Responsive adjustments */
        @media (max-width: 480px) {
            .profile-card {
                padding: 26px 12px;
                border-radius: 14px;
            }
            .nickname {
                font-size: 22px;
            }
            .badge-list {
                gap: 3px;
            }
            .badge-item {
                font-size: 7.8px;
                padding: 2px 4px;
                letter-spacing: 0;
            }
            .socials-row {
                gap: 8px;
            }
            .view-counter {
                bottom: 14px;
                left: 14px;
                padding: 5px 10px;
                font-size: 10px;
            }
        }
    </style>
</head>

    <script>
        /* ===================================================
           1. AMBIENT CURSOR GLOW
        =================================================== */
        const glow = document.getElementById('ambientGlow');
        let glowReq = null;
        window.addEventListener('mousemove', (e) => {
            if (glowReq) cancelAnimationFrame(glowReq);
            glowReq = requestAnimationFrame(() => {
                glow.style.left = e.clientX + 'px';
                glow.style.top = e.clientY + 'px';
            });
        });
    </script>
